<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateTech — Market Analytics KZT</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141417;
      --border-color: #24242a;
      --accent-color: #ffffff;
      --subtext: #8a8a93;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--accent-color); padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    header { margin-bottom: 20px; text-align: center; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--subtext); }
    
    .search-box { margin-bottom: 16px; }
    input[type="text"] { width: 100%; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #555; }

    .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { flex: 1; min-width: 100px; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--subtext); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .filter-btn.defect-active { background: var(--red); color: #fff; border-color: var(--red); }

    .device-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .device-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .device-category { font-size: 11px; color: var(--subtext); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0d0d0f; padding: 12px; border-radius: 10px; }
    .price-item { text-align: center; }
    .price-label { font-size: 10px; text-transform: uppercase; color: var(--subtext); margin-bottom: 4px; }
    .price-value { font-size: 13px; font-weight: 700; }

    .price-value.low { color: var(--green); }
    .price-value.market { color: var(--yellow); }
    .price-value.high { color: var(--subtext); }
    .price-value.defect { color: var(--red); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">RATE TECH</div>
    <div class="subtitle">Market Analytics & Price Check KZT</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Search (A01 Core, A23, iPhone 11, PS4, Redmi...)" oninput="render()">
  </div>

  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" id="btnUsed" onclick="setCondition('used')">Used (Good)</button>
      <button class="filter-btn" id="btnNew" onclick="setCondition('new')">Brand New</button>
      <button class="filter-btn" id="btnDefect" onclick="toggleDefect()">⚠️ Damaged / Defects</button>
    </div>
  </div>

  <div id="devicesList"></div>
</div>

<script>
  const devices = [
    // ================= SAMSUNG GALAXY (РАЗДЕЛЕНЫ ТОЧНО ПО OLX) =================
    { name: "Samsung Galaxy A01 Core", ru: "самсунг а01 кор a01 core а01кор", category: "Samsung", low: 4000, market: 7000, high: 10000, defectLow: 1500, defectMarket: 3000, newMarket: 22000 },
    { name: "Samsung Galaxy A01", ru: "самсунг а01 a01", category: "Samsung", low: 6000, market: 10000, high: 14000, defectLow: 2500, defectMarket: 4500, newMarket: 28000 },
    { name: "Samsung Galaxy A02 / A02s", ru: "самсунг а02 а02с a02s", category: "Samsung", low: 10000, market: 15000, high: 20000, defectLow: 4000, defectMarket: 7000, newMarket: 35000 },
    { name: "Samsung Galaxy A03 / A03s / A03 Core", ru: "самсунг а03 а03с a03s", category: "Samsung", low: 14000, market: 20000, high: 26000, defectLow: 5500, defectMarket: 9000, newMarket: 42000 },
    { name: "Samsung Galaxy A10 / A10s", ru: "самсунг а10 а10с a10s", category: "Samsung", low: 12000, market: 18000, high: 24000, defectLow: 5000, defectMarket: 8000, newMarket: 38000 },
    { name: "Samsung Galaxy A12", ru: "самсунг а12 a12", category: "Samsung", low: 22000, market: 30000, high: 38000, defectLow: 9000, defectMarket: 14000, newMarket: 55000 },
    { name: "Samsung Galaxy A13", ru: "самсунг а13 a13", category: "Samsung", low: 26000, market: 35000, high: 44000, defectLow: 11000, defectMarket: 17000, newMarket: 62000 },
    { name: "Samsung Galaxy A14", ru: "самсунг а14 a14", category: "Samsung", low: 32000, market: 42000, high: 50000, defectLow: 14000, defectMarket: 20000, newMarket: 70000 },
    { name: "Samsung Galaxy A20 / A20s / A21s", ru: "самсунг а20 а21с a21s", category: "Samsung", low: 18000, market: 25000, high: 32000, defectLow: 7500, defectMarket: 12000, newMarket: 48000 },
    { name: "Samsung Galaxy A22 / A22 5G", ru: "самсунг а22 a22", category: "Samsung", low: 28000, market: 38000, high: 46000, defectLow: 12000, defectMarket: 18000, newMarket: 68000 },
    { name: "Samsung Galaxy A23", ru: "самсунг а23 a23", category: "Samsung", low: 35000, market: 46000, high: 56000, defectLow: 15000, defectMarket: 22000, newMarket: 78000 },
    { name: "Samsung Galaxy A24", ru: "самсунг а24 a24", category: "Samsung", low: 45000, market: 58000, high: 68000, defectLow: 20000, defectMarket: 30000, newMarket: 92000 },
    { name: "Samsung Galaxy A30 / A31", ru: "самсунг а30 а31 a31", category: "Samsung", low: 22000, market: 30000, high: 38000, defectLow: 9000, defectMarket: 15000, newMarket: 58000 },
    { name: "Samsung Galaxy A32", ru: "самсунг а32 a32", category: "Samsung", low: 34000, market: 45000, high: 56000, defectLow: 14000, defectMarket: 22000, newMarket: 78000 },
    { name: "Samsung Galaxy A33 5G", ru: "самсунг а33 a33", category: "Samsung", low: 48000, market: 62000, high: 75000, defectLow: 22000, defectMarket: 32000, newMarket: 105000 },
    { name: "Samsung Galaxy A34 5G", ru: "самсунг а34 a34", category: "Samsung", low: 62000, market: 78000, high: 92000, defectLow: 28000, defectMarket: 40000, newMarket: 125000 },
    { name: "Samsung Galaxy A50 / A51", ru: "самсунг а50 а51 a51", category: "Samsung", low: 25000, market: 35000, high: 44000, defectLow: 10000, defectMarket: 16000, newMarket: 65000 },
    { name: "Samsung Galaxy A52", ru: "самсунг а52 a52", category: "Samsung", low: 45000, market: 58000, high: 70000, defectLow: 20000, defectMarket: 30000, newMarket: 105000 },
    { name: "Samsung Galaxy A53 5G", ru: "самсунг а53 a53", category: "Samsung", low: 58000, market: 74000, high: 88000, defectLow: 26000, defectMarket: 38000, newMarket: 130000 },
    { name: "Samsung Galaxy A54 5G", ru: "самсунг а54 a54", category: "Samsung", low: 78000, market: 98000, high: 118000, defectLow: 38000, defectMarket: 52000, newMarket: 155000 },
    { name: "Samsung Galaxy S10e / S10 / S10+", ru: "самсунг с10 с10е s10", category: "Samsung", low: 38000, market: 50000, high: 62000, defectLow: 16000, defectMarket: 25000, newMarket: 95000 },
    { name: "Samsung Galaxy S20 FE", ru: "самсунг с20 фе s20 fe", category: "Samsung", low: 48000, market: 62000, high: 75000, defectLow: 22000, defectMarket: 32000, newMarket: 120000 },
    { name: "Samsung Galaxy S21 Ultra", ru: "самсунг с21 ультра s21 ultra", category: "Samsung", low: 115000, market: 140000, high: 165000, defectLow: 60000, defectMarket: 80000, newMarket: 250000 },

    // ================= REDMI =================
    { name: "Xiaomi Redmi 1", ru: "редми 1 сяоми", category: "Xiaomi", low: 2000, market: 3500, high: 5000, defectLow: 1000, defectMarket: 2000, newMarket: 12000 },
    { name: "Xiaomi Redmi 1S", ru: "редми 1с редми 1 s", category: "Xiaomi", low: 2500, market: 4500, high: 6500, defectLow: 1000, defectMarket: 2000, newMarket: 14000 },
    { name: "Xiaomi Redmi 9A", ru: "редми 9а редми 9 а", category: "Xiaomi", low: 13000, market: 19000, high: 25000, defectLow: 5000, defectMarket: 9500, newMarket: 42000 },
    { name: "Xiaomi Redmi Note 10 Pro", ru: "редми нот 10 про", category: "Xiaomi", low: 38000, market: 52000, high: 65000, defectLow: 19000, defectMarket: 28000, newMarket: 90000 },

    // ================= APPLE IPHONE =================
    { name: "Apple iPhone 5s", ru: "айфон 5с 5s", category: "Apple", low: 7000, market: 12000, high: 18000, defectLow: 3000, defectMarket: 5000, newMarket: 30000 },
    { name: "Apple iPhone 11 64GB", ru: "айфон 11", category: "Apple", low: 48000, market: 58000, high: 70000, defectLow: 25000, defectMarket: 35000, newMarket: 140000 },
    { name: "Apple iPhone 12 128GB", ru: "айфон 12", category: "Apple", low: 95000, market: 115000, high: 130000, defectLow: 50000, defectMarket: 70000, newMarket: 220000 },

    // ================= CONSOLES =================
    { name: "Sony PlayStation 4 Slim", ru: "плейстейшен 4 слим пс4 ps4 slim", category: "Console", low: 50000, market: 65000, high: 78000, defectLow: 28000, defectMarket: 38000, newMarket: 125000 },
    { name: "Sony PlayStation 5 Disc", ru: "плейстейшен 5 пс5 ps5", category: "Console", low: 170000, market: 198000, high: 225000, defectLow: 105000, defectMarket: 135000, newMarket: 265000 }
  ];

  let currentCondition = 'used';
  let showDefects = false;

  function setCondition(cond) {
    currentCondition = cond;
    showDefects = false;
    document.getElementById('btnUsed').classList.toggle('active', cond === 'used');
    document.getElementById('btnNew').classList.toggle('active', cond === 'new');
    document.getElementById('btnDefect').classList.remove('defect-active');
    render();
  }

  function toggleDefect() {
    showDefects = !showDefects;
    document.getElementById('btnDefect').classList.toggle('defect-active', showDefects);
    if(showDefects) {
      document.getElementById('btnUsed').classList.remove('active');
      document.getElementById('btnNew').classList.remove('active');
    } else {
      setCondition('used');
    }
    render();
  }

  function formatPrice(val) {
    return val.toLocaleString('ru-RU') + ' ₸';
  }

  function render() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('devicesList');
    list.innerHTML = '';

    let filtered = devices.filter(d => 
      d.name.toLowerCase().includes(query) || 
      d.category.toLowerCase().includes(query) || 
      (d.ru && d.ru.toLowerCase().includes(query))
    );

    if (filtered.length === 0 && query.length > 1) {
      filtered = [{
        name: query.toUpperCase() + " (Auto-Calc)",
        category: "Estimated Market Value",
        low: 15000, market: 28000, high: 42000,
        defectLow: 6000, defectMarket: 12000, newMarket: 55000
      }];
    }

    filtered.forEach(d => {
      let priceHTML = '';

      if (showDefects) {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Heavy / Parts</div>
            <div class="price-value defect">${formatPrice(d.defectLow)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Screen / Battery</div>
            <div class="price-value defect">${formatPrice(d.defectMarket)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Minor Defect</div>
            <div class="price-value market">${formatPrice(d.low)}</div>
          </div>
        `;
      } else if (currentCondition === 'new') {
        priceHTML = `
          <div class="price-item" style="grid-column: span 3;">
            <div class="price-label">Brand New Sealed</div>
            <div class="price-value market">${formatPrice(d.newMarket)}</div>
          </div>
        `;
      } else {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Below Market</div>
            <div class="price-value low">${formatPrice(d.low)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Average Market</div>
            <div class="price-value market">${formatPrice(d.market)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Above Market</div>
            <div class="price-value high">${formatPrice(d.high)}</div>
          </div>
        `;
      }

      const card = document.createElement('div');
      card.className = 'device-card';
      card.innerHTML = `
        <div class="device-title">${d.name}</div>
        <div class="device-category">${d.category}</div>
        <div class="price-grid">${priceHTML}</div>
      `;
      list.appendChild(card);
    });
  }

  render();
</script>
</body>
</html>
