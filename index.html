  <meta charset="UTF-8">

  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141417;
      --border-color: #24242a;
      --accent-color: #ffffff;
      --subtext: #8a8a93;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--accent-color); padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    header { margin-bottom: 20px; text-align: center; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--subtext); }
    
    .search-box { margin-bottom: 16px; }
    input[type="text"] { width: 100%; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #555; }

    .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { flex: 1; min-width: 100px; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--subtext); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .filter-btn.defect-active { background: var(--red); color: #fff; border-color: var(--red); }

    .device-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .device-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .device-category { font-size: 11px; color: var(--subtext); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0d0d0f; padding: 12px; border-radius: 10px; }
    .price-item { text-align: center; }
    .price-label { font-size: 10px; text-transform: uppercase; color: var(--subtext); margin-bottom: 4px; }
    .price-value { font-size: 13px; font-weight: 700; }

    .price-value.low { color: var(--green); }
    .price-value.market { color: var(--yellow); }
    .price-value.high { color: var(--subtext); }
    .price-value.defect { color: var(--red); }
  </style>
</head>
<body>

      <button class="filter-btn" id="btnDefect" onclick="toggleDefect()">⚠️ Damaged / Defects</button>

  let currentCondition = 'used';
  let showDefects = false;

  function setCondition(cond) {
    currentCondition = cond;
    showDefects = false;
    document.getElementById('btnUsed').classList.toggle('active', cond === 'used');
    document.getElementById('btnNew').classList.toggle('active', cond === 'new');
    document.getElementById('btnDefect').classList.remove('defect-active');
    render();
  }

  function toggleDefect() {
    showDefects = !showDefects;
    document.getElementById('btnDefect').classList.toggle('defect-active', showDefects);
    if(showDefects) {
      document.getElementById('btnUsed').classList.remove('active');
      document.getElementById('btnNew').classList.remove('active');
    } else {
      setCondition('used');
    }
    render();
  }

  function formatPrice(val) {
    return val.toLocaleString('ru-RU') + ' ₸';
  }

  function render() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('devicesList');
    list.innerHTML = '';

    let filtered = devices.filter(d => 
      d.name.toLowerCase().includes(query) || 
      d.category.toLowerCase().includes(query) || 
      (d.ru && d.ru.toLowerCase().includes(query))
    );

    if (filtered.length === 0 && query.length > 1) {
      filtered = [{
        name: query.toUpperCase() + " (Auto-Calc)",
        category: "Estimated Market Value",
        low: 15000, market: 28000, high: 42000,
        defectLow: 6000, defectMarket: 12000, newMarket: 55000
      }];
    }

    filtered.forEach(d => {
      let priceHTML = '';

      if (showDefects) {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Heavy / Parts</div>
            <div class="price-value defect">${formatPrice(d.defectLow)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Screen / Battery</div>
            <div class="price-value defect">${formatPrice(d.defectMarket)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Minor Defect</div>
            <div class="price-value market">${formatPrice(d.low)}</div>
          </div>
        `;
      } else if (currentCondition === 'new') {
        priceHTML = `
          <div class="price-item" style="grid-column: span 3;">
            <div class="price-label">Brand New Sealed</div>
            <div class="price-value market">${formatPrice(d.newMarket)}</div>
          </div>
        `;
      } else {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Below Market</div>
            <div class="price-value low">${formatPrice(d.low)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Average Market</div>
            <div class="price-value market">${formatPrice(d.market)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Above Market</div>
            <div class="price-value high">${formatPrice(d.high)}</div>
          </div>
        `;
      }

      const card = document.createElement('div');
      card.className = 'device-card';
      card.innerHTML = `
        <div class="device-title">${d.name}</div>
        <div class="device-category">${d.category}</div>
        <div class="price-grid">${priceHTML}</div>
      `;
      list.appendChild(card);
    });
  }

  render();
