<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateTech — Аналитика цен KZT</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141417;
      --border-color: #24242a;
      --accent-color: #ffffff;
      --subtext: #8a8a93;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--accent-color); padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 650px; }
    header { margin-bottom: 20px; text-align: center; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--subtext); }
    
    .search-box { margin-bottom: 16px; }
    input[type="text"] { width: 100%; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #555; }

    .filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .filter-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .filter-btn { flex: 1; min-width: 100px; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--subtext); border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .filter-btn.defect-active { background: var(--red); color: #fff; border-color: var(--red); }

    .device-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .device-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .device-category { font-size: 11px; color: var(--subtext); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }

    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0d0d0f; padding: 12px; border-radius: 10px; }
    .price-item { text-align: center; }
    .price-label { font-size: 10px; text-transform: uppercase; color: var(--subtext); margin-bottom: 4px; }
    .price-value { font-size: 13px; font-weight: 700; }

    .price-value.low { color: var(--green); }
    .price-value.market { color: var(--yellow); }
    .price-value.high { color: var(--subtext); }
    .price-value.defect { color: var(--red); }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">RATE TECH</div>
    <div class="subtitle">Полная база оценок рынка Казахстана (KZT)</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Введите любой телефон (Nokia, Pixel, Tecno, iPhone, Poco...)" oninput="render()">
  </div>

  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" id="btnUsed" onclick="setCondition('used')">Б/У (Идеал/Хорошее)</button>
      <button class="filter-btn" id="btnNew" onclick="setCondition('new')">Новый</button>
      <button class="filter-btn" id="btnDefect" onclick="toggleDefect()">⚠️ С дефектом (Разбит/АКБ)</button>
    </div>
  </div>

  <div id="devicesList"></div>
</div>

<script>
  const devices = [
    // --- NOKIA ---
    { name: "Nokia 3310 / Кнопочные классика", category: "Nokia", low: 3000, market: 5000, high: 8000, defectLow: 1000, defectMarket: 2500, newMarket: 12000 },
    { name: "Nokia 8.3 / G50 5G", category: "Nokia", low: 30000, market: 42000, high: 55000, defectLow: 15000, defectMarket: 22000, newMarket: 85000 },
    
    // --- GOOGLE PIXEL ---
    { name: "Google Pixel 3 / 3 XL", category: "Google Pixel", low: 25000, market: 35000, high: 45000, defectLow: 12000, defectMarket: 18000, newMarket: 75000 },
    { name: "Google Pixel 4a / 5", category: "Google Pixel", low: 45000, market: 60000, high: 75000, defectLow: 22000, defectMarket: 32000, newMarket: 110000 },
    { name: "Google Pixel 6 / 6 Pro", category: "Google Pixel", low: 85000, market: 110000, high: 135000, defectLow: 45000, defectMarket: 65000, newMarket: 190000 },
    { name: "Google Pixel 7 Pro", category: "Google Pixel", low: 160000, market: 190000, high: 220000, defectLow: 90000, defectMarket: 120000, newMarket: 310000 },
    { name: "Google Pixel 8 Pro", category: "Google Pixel", low: 240000, market: 280000, high: 320000, defectLow: 140000, defectMarket: 180000, newMarket: 420000 },

    // --- SONY XPERIA ---
    { name: "Sony Xperia XZ2 / XZ3", category: "Sony Xperia", low: 25000, market: 38000, high: 50000, defectLow: 12000, defectMarket: 18000, newMarket: 80000 },
    { name: "Sony Xperia 1 / 5 Mark I-II", category: "Sony Xperia", low: 65000, market: 85000, high: 110000, defectLow: 32000, defectMarket: 45000, newMarket: 170000 },
    { name: "Sony Xperia 1 Mark IV", category: "Sony Xperia", low: 180000, market: 220000, high: 260000, defectLow: 100000, defectMarket: 130000, newMarket: 390000 },

    // --- MOTOROLA ---
    { name: "Motorola Moto G8 / G30", category: "Motorola", low: 20000, market: 28000, high: 38000, defectLow: 9000, defectMarket: 14000, newMarket: 55000 },
    { name: "Motorola Edge 20 / 30 Pro", category: "Motorola", low: 75000, market: 98000, high: 120000, defectLow: 38000, defectMarket: 52000, newMarket: 185000 },

    // --- INFINIX & TECNO ---
    { name: "Tecno Spark 6 / 8 / 10", category: "Tecno", low: 18000, market: 25000, high: 35000, defectLow: 8000, defectMarket: 13000, newMarket: 48000 },
    { name: "Tecno Camon 19 / 20 Pro", category: "Tecno", low: 42000, market: 55000, high: 70000, defectLow: 20000, defectMarket: 30000, newMarket: 95000 },
    { name: "Infinix Hot 11 / 12 / 30", category: "Infinix", low: 22000, market: 30000, high: 40000, defectLow: 9000, defectMarket: 15000, newMarket: 55000 },
    { name: "Infinix Note 12 / 30 VIP", category: "Infinix", low: 48000, market: 62000, high: 78000, defectLow: 24000, defectMarket: 34000, newMarket: 105000 },

    // --- REALME / OPPO / VIVO ---
    { name: "Realme C11 / C25 / C33", category: "Realme", low: 18000, market: 26000, high: 35000, defectLow: 8000, defectMarket: 13000, newMarket: 48000 },
    { name: "Realme 8 / 9 Pro / 10", category: "Realme", low: 45000, market: 60000, high: 75000, defectLow: 22000, defectMarket: 32000, newMarket: 105000 },
    { name: "Oppo A15 / A53 / A74", category: "Oppo", low: 22000, market: 32000, high: 42000, defectLow: 10000, defectMarket: 16000, newMarket: 60000 },
    { name: "Vivo Y11 / Y20 / Y33s", category: "Vivo", low: 22000, market: 32000, high: 43000, defectLow: 10000, defectMarket: 16000, newMarket: 62000 },

    // --- ZTE & HUAWEI / HONOR ---
    { name: "ZTE Blade A3 / A5 / A7", category: "ZTE", low: 10000, market: 16000, high: 22000, defectLow: 4000, defectMarket: 8000, newMarket: 32000 },
    { name: "Huawei P30 Pro", category: "Huawei", low: 55000, market: 72000, high: 90000, defectLow: 28000, defectMarket: 40000, newMarket: 140000 },
    { name: "Honor 8X / 9X / 10i", category: "Honor", low: 22000, market: 30000, high: 40000, defectLow: 9000, defectMarket: 15000, newMarket: 60000 },
    { name: "Honor 50 / 70 5G", category: "Honor", low: 65000, market: 85000, high: 110000, defectLow: 32000, defectMarket: 45000, newMarket: 165000 },

    // --- XIAOMI / POCO / REDMI ---
    { name: "Redmi 9A / 9C / 10A", category: "Xiaomi", low: 12000, market: 18000, high: 25000, defectLow: 5000, defectMarket: 9000, newMarket: 40000 },
    { name: "Redmi Note 10 / 11 Pro", category: "Xiaomi", low: 35000, market: 48000, high: 62000, defectLow: 18000, defectMarket: 26000, newMarket: 85000 },
    { name: "Poco X3 Pro / X3 NFC", category: "Poco", low: 35000, market: 48000, high: 60000, defectLow: 18000, defectMarket: 25000, newMarket: 90000 },
    { name: "Poco F3 / F4 / F5", category: "Poco", low: 75000, market: 95000, high: 120000, defectLow: 40000, defectMarket: 55000, newMarket: 165000 },

    // --- SAMSUNG ---
    { name: "Samsung Galaxy A01 Core", category: "Samsung", low: 10000, market: 15000, high: 20000, defectLow: 5000, defectMarket: 8000, newMarket: 35000 },
    { name: "Samsung Galaxy A12 / A13 / A14", category: "Samsung", low: 28000, market: 38000, high: 48000, defectLow: 12000, defectMarket: 19000, newMarket: 65000 },
    { name: "Samsung Galaxy S20 FE", category: "Samsung", low: 50000, market: 65000, high: 80000, defectLow: 25000, defectMarket: 35000, newMarket: 130000 },
    { name: "Samsung Galaxy S21 / S22 / S23 Ultra", category: "Samsung", low: 140000, market: 180000, high: 220000, defectLow: 75000, defectMarket: 105000, newMarket: 320000 },

    // --- APPLE IPHONE ---
    { name: "iPhone 7 / 8 64GB", category: "Apple", low: 18000, market: 25000, high: 33000, defectLow: 8000, defectMarket: 12000, newMarket: 55000 },
    { name: "iPhone X / XR 64GB", category: "Apple", low: 35000, market: 45000, high: 55000, defectLow: 18000, defectMarket: 25000, newMarket: 95000 },
    { name: "iPhone 11 64GB", category: "Apple", low: 48000, market: 58000, high: 70000, defectLow: 28000, defectMarket: 38000, newMarket: 140000 },
    { name: "iPhone 12 / 13 128GB", category: "Apple", low: 110000, market: 135000, high: 160000, defectLow: 60000, defectMarket: 80000, newMarket: 240000 },
    { name: "iPhone 14 Pro / 15 Pro Max", category: "Apple", low: 280000, market: 340000, high: 400000, defectLow: 180000, defectMarket: 230000, newMarket: 520000 }
  ];

  let currentCondition = 'used';
  let showDefects = false;

  function setCondition(cond) {
    currentCondition = cond;
    showDefects = false;
    document.getElementById('btnUsed').classList.toggle('active', cond === 'used');
    document.getElementById('btnNew').classList.toggle('active', cond === 'new');
    document.getElementById('btnDefect').classList.remove('defect-active');
    render();
  }

  function toggleDefect() {
    showDefects = !showDefects;
    document.getElementById('btnDefect').classList.toggle('defect-active', showDefects);
    if(showDefects) {
      document.getElementById('btnUsed').classList.remove('active');
      document.getElementById('btnNew').classList.remove('active');
    } else {
      setCondition('used');
    }
    render();
  }

  function formatPrice(val) {
    return val.toLocaleString('ru-RU') + ' ₸';
  }

  function render() {
    const query = document.getElementById('searchInput').value.trim().toLowerCase();
    const list = document.getElementById('devicesList');
    list.innerHTML = '';

    let filtered = devices.filter(d => d.name.toLowerCase().includes(query) || d.category.toLowerCase().includes(query));

    // Авто-расчет редких запросов
    if (filtered.length === 0 && query.length > 2) {
      filtered = [{
        name: query.toUpperCase() + " (Авто-расчет)",
        category: "Оценка по алгоритму",
        low: 25000, market: 35000, high: 48000,
        defectLow: 10000, defectMarket: 18000, newMarket: 65000
      }];
    }

    filtered.forEach(d => {
      let priceHTML = '';

      if (showDefects) {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Срочно / Разбит</div>
            <div class="price-value defect">${formatPrice(d.defectLow)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Средний дефект</div>
            <div class="price-value defect">${formatPrice(d.defectMarket)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Мелкий нюанс</div>
            <div class="price-value market">${formatPrice(d.low)}</div>
          </div>
        `;
      } else if (currentCondition === 'new') {
        priceHTML = `
          <div class="price-item" style="grid-column: span 3;">
            <div class="price-label">Запечатанный / Новый</div>
            <div class="price-value market">${formatPrice(d.newMarket)}</div>
          </div>
        `;
      } else {
        priceHTML = `
          <div class="price-item">
            <div class="price-label">Ниже рынка</div>
            <div class="price-value low">${formatPrice(d.low)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Рынок (Обычная)</div>
            <div class="price-value market">${formatPrice(d.market)}</div>
          </div>
          <div class="price-item">
            <div class="price-label">Выше рынка</div>
            <div class="price-value high">${formatPrice(d.high)}</div>
          </div>
        `;
      }

      const card = document.createElement('div');
      card.className = 'device-card';
      card.innerHTML = `
        <div class="device-title">${d.name}</div>
        <div class="device-category">${d.category}</div>
        <div class="price-grid">${priceHTML}</div>
      `;
      list.appendChild(card);
    });
  }

  render();
</script>
</body>
</html>
