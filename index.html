<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RateTech — Market Analytics KZT</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --card-bg: #141417;
      --border-color: #24242a;
      --accent-color: #ffffff;
      --subtext: #8a8a93;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --pill-bg: #1a1a1f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--accent-color); padding: 20px 15px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 680px; }
    
    header { margin-bottom: 16px; text-align: center; }
    .logo { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--subtext); }
    
    .search-box { margin-bottom: 12px; }
    input[type="text"] { width: 100%; padding: 14px 16px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; color: #fff; font-size: 15px; outline: none; }
    input[type="text"]:focus { border-color: #555; }

    .categories-scroll { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; scrollbar-width: none; }
    .categories-scroll::-webkit-scrollbar { display: none; }
    .cat-pill { background: var(--pill-bg); border: 1px solid var(--border-color); color: var(--subtext); padding: 8px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .cat-pill.active { background: #fff; color: #000; border-color: #fff; }

    .filters { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .filter-group { display: flex; gap: 8px; }
    .filter-btn { flex: 1; padding: 10px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--subtext); border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: center; }
    .filter-btn.active { background: #fff; color: #000; border-color: #fff; }
    .filter-btn.defect-active { background: var(--red); color: #fff; border-color: #fff; }

    .device-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .device-title { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .device-category { font-size: 11px; color: var(--subtext); margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

    .price-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: #0d0d0f; padding: 12px; border-radius: 10px; }
    .price-item { text-align: center; }
    .price-label { font-size: 10px; text-transform: uppercase; color: var(--subtext); margin-bottom: 4px; }
    .price-value { font-size: 13px; font-weight: 700; }

    .price-value.low { color: var(--green); }
    .price-value.market { color: var(--yellow); }
    .price-value.high { color: var(--subtext); }
    .price-value.defect { color: var(--red); }
    .empty-msg { text-align: center; color: var(--subtext); padding: 40px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="logo">RATE TECH</div>
    <div class="subtitle">Market Analytics & Price Check KZT</div>
  </header>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Поиск (айфон 11, редми 9, а12, пс4...)" oninput="render()">
  </div>

  <div class="categories-scroll">
    <button class="cat-pill active" onclick="selectCat('all', this)">Все</button>
    <button class="cat-pill" onclick="selectCat('Apple', this)">Apple</button>
    <button class="cat-pill" onclick="selectCat('Samsung', this)">Samsung</button>
    <button class="cat-pill" onclick="selectCat('Xiaomi', this)">Xiaomi</button>
    <button class="cat-pill" onclick="selectCat('Poco', this)">Poco</button>
    <button class="cat-pill" onclick="selectCat('Console', this)">Консоли</button>
  </div>

  <div class="filters">
    <div class="filter-group">
      <button class="filter-btn active" id="btnUsed" onclick="setCondition('used')">Used (Good)</button>
      <button class="filter-btn" id="btnNew" onclick="setCondition('new')">Brand New</button>
      <button class="filter-btn" id="btnDefect" onclick="toggleDefect()">⚠️ Минусы / Дефекты</button>
    </div>
  </div>

  <div id="devicesList"></div>
</div>

    { name: "Apple iPhone 13 Pro Max", searchKey: "apple iphone 13 pro max айфон 13 про макс", category: "Apple", low: 200000, market: 235000, high: 265000, newMarket: 360000, def1: "Без Face ID", def1P: 120000, def2: "Ошибка дисплея", def2P: 150000, def3: "АКБ < 82%", def3P: 165000 },
    { name: "Apple iPhone 14", searchKey: "apple iphone 14 айфон 14", category: "Apple", low: 185000, market: 215000, high: 240000, newMarket: 310000, def1: "Без Face ID", def1P: 105000, def2: "Заменен экран", def2P: 135000, def3: "АКБ < 85%", def3P: 150000 },

    { name: "Apple iPhone 14 Pro Max", searchKey: "apple iphone 14 pro max айфон 14 про макс", category: "Apple", low: 270000, market: 310000, high: 350000, newMarket: 450000, def1: "Без Face ID", def1P: 165000, def2: "Заменен экран", def2P: 205000, def3: "АКБ < 85%", def3P: 225000 },

    { name: "Apple iPhone 15 Plus", searchKey: "apple iphone 15 plus айфон 15 плюс", category: "Apple", low: 290000, market: 335000, high: 380000, newMarket: 450000, def1: "Без Face ID", def1P: 180000, def2: "Заменен экран", def2P: 220000, def3: "АКБ < 88%", def3P: 240000 },
    { name: "Apple iPhone 15 Pro", searchKey: "apple iphone 15 pro айфон 15 про", category: "Apple", low: 340000, market: 390000, high: 430000, newMarket: 520000, def1: "Без Face ID", def1P: 220000, def2: "Заменен экран", def2P: 270000, def3: "АКБ < 88%", def3P: 295000 },
    { name: "Apple iPhone 15 Pro Max", searchKey: "apple iphone 15 pro max айфон 15 про макс", category: "Apple", low: 400000, market: 460000, high: 520000, newMarket: 610000, def1: "Без Face ID", def1P: 260000, def2: "Заменен экран", def2P: 320000, def3: "АКБ < 88%", def3P: 350000 },

    // ================= SAMSUNG GALAXY =================

    { name: "Samsung Galaxy A52", searchKey: "samsung galaxy a52 самсунг а52", category: "Samsung", low: 45000, market: 58000, high: 70000, newMarket: 105000, def1: "Разбит экран / Пятно", def1P: 22000, def2: "Нет отпечатка", def2P: 32000, def3: "Слабый АКБ", def3P: 38000 },

    // ================= XIAOMI / REDMI =================

    // ================= POCO =================

    // ================= CONSOLES =================

    { name: "Sony PlayStation 5 Disc", searchKey: "sony playstation 5 disc пс5 ps5", category: "Console", low: 170000, market: 198000, high: 225000, newMarket: 265000, def1: "Шум дросселей", def1P: 120000, def2: "Проблемы с дисководом", def2P: 140000, def3: "Без геймпада", def3P: 150000 }
  ];

  let currentCondition = 'used';
  let showDefects = false;
  let activeCat = 'all';

  function setCondition(cond) {
    currentCondition = cond;
    showDefects = false;
    document.getElementById('btnUsed').className = 'filter-btn ' + (cond === 'used' ? 'active' : '');
    document.getElementById('btnNew').className = 'filter-btn ' + (cond === 'new' ? 'active' : '');
    document.getElementById('btnDefect').className = 'filter-btn';
    render();
  }

  function toggleDefect() {
    showDefects = !showDefects;
    document.getElementById('btnDefect').className = 'filter-btn ' + (showDefects ? 'defect-active' : '');
    if (showDefects) {
      document.getElementById('btnUsed').className = 'filter-btn';
      document.getElementById('btnNew').className = 'filter-btn';
    } else {
      setCondition('used');
    }
    render();
  }

  function selectCat(cat, btn) {
    activeCat = cat;
    document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function formatPrice(val) {
    return val.toLocaleString('ru-RU') + ' ₸';
  }

  function render() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('devicesList');
    list.innerHTML = '';

    let res = devices.filter(d => {
      let matchCat = (activeCat === 'all' || d.category === activeCat);
      let matchText = (query === '' || 
        d.name.toLowerCase().includes(query) || 
        d.category.toLowerCase().includes(query) || 
        (d.searchKey && d.searchKey.toLowerCase().includes(query))
      );
      return matchCat && matchText;
    });

    if (res.length === 0) {
      list.innerHTML = '<div class="empty-msg">Ничего не найдено</div>';
      return;
    }

    res.forEach(d => {
      let priceHTML = '';

      if (showDefects) {
        let d1 = d.def1 || "Сильный дефект";
        let p1 = d.def1P || Math.round(d.low * 0.6);
        let d2 = d.def2 || "Средний дефект";
        let p2 = d.def2P || Math.round(d.low * 0.75);
        let d3 = d.def3 || "Мелкий дефект";
        let p3 = d.def3P || Math.round(d.low * 0.85);

        priceHTML = `
          <div class="price-item"><div class="price-label">${d1}</div><div class="price-value defect">${formatPrice(p1)}</div></div>
          <div class="price-item"><div class="price-label">${d2}</div><div class="price-value defect">${formatPrice(p2)}</div></div>
          <div class="price-item"><div class="price-label">${d3}</div><div class="price-value market">${formatPrice(p3)}</div></div>
        `;
      } else if (currentCondition === 'new') {
        priceHTML = `
          <div class="price-item" style="grid-column: span 3;">
            <div class="price-label">Новый / Запечатан</div>
            <div class="price-value market">${formatPrice(d.newMarket)}</div>
          </div>
        `;
      } else {
        priceHTML = `
          <div class="price-item"><div class="price-label">Ниже рынка</div><div class="price-value low">${formatPrice(d.low)}</div></div>
          <div class="price-item"><div class="price-label">Средняя цена</div><div class="price-value market">${formatPrice(d.market)}</div></div>
          <div class="price-item"><div class="price-label">Выше рынка</div><div class="price-value high">${formatPrice(d.high)}</div></div>
        `;
      }

      const card = document.createElement('div');
      card.className = 'device-card';
      card.innerHTML = `
        <div class="device-title">${d.name}</div>
        <div class="device-category">${d.category}</div>
        <div class="price-grid">${priceHTML}</div>
      `;
      list.appendChild(card);
    });
  }

  render();
</script>
</body>
</html>
